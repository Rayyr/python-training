<h2>Dashboard</h2>

{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    {% for category, message in messages %}
      <div style="color:green;">{{ message }}</div>
    {% endfor %}
  {% endif %}
{% endwith %}

<p>Welcome {{ user.username }}</p>
<a href="/logout">Logout</a>
