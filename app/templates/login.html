{% extends "base.html" %}

{% block content %}

<h1>Login</h1>

<form method="POST">

    <label>Username</label>

    <input
        type="text"
        name="username"
        required
    >

    <br><br>

    <label>Password</label>

    <input
        type="password"
        name="password"
        required
    >

    <br><br>

    <button type="submit">
        Login
    </button>

</form>

<p>
    Don't have an account?

    <a href="{{ url_for('auth.register') }}">
        Register
    </a>
</p>

{% endblock %}
