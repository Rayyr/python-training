{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6"><div class="card"><div class="card-body">
<h1 class="h3 mb-3">Create an account</h1><p class="text-muted">Create your Student Portal account.</p>
<form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="mb-3"><label class="form-label">Full Name</label><input class="form-control" type="text" name="name" required minlength="2" maxlength="120"></div>
<div class="mb-3"><label class="form-label">Email</label><input class="form-control" type="email" name="email" required autocomplete="email"></div>
<div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" required minlength="6"><div class="form-text">At least 6 characters.</div></div>
<div class="mb-3"><label class="form-label">Confirm Password</label><input class="form-control" type="password" name="confirm_password" required minlength="6"></div>
<button class="btn btn-primary w-100">Create Account</button></form>
<p class="mt-3 mb-0 text-center">Already have an account? <a href="{{ url_for('auth.login') }}">Login</a></p>
</div></div></div></div>
{% endblock %}
