{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5"><div class="card"><div class="card-body">
<h1 class="h3 mb-3">Login</h1><p class="text-muted">Sign in to access the Student Portal.</p>
<form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="mb-3"><label class="form-label">Email</label><input class="form-control" type="email" name="email" required autocomplete="email"></div>
<div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" required autocomplete="current-password"></div>
<button class="btn btn-primary w-100">Login</button></form>
<p class="mt-3 mb-0 text-center">Don't have an account? <a href="{{ url_for('auth.signup') }}">Sign up</a></p>
</div></div></div></div>
{% endblock %}
